<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HisNHerFlames.com - Custom Lighter Wrap Studio</title>
    <style>
        :root {
            --neon-pink: #ff2a85;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --bg-space: #070712;
            --panel-bg: rgba(15, 15, 30, 0.88);
            --border-glow: rgba(0, 243, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-space);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            position: relative;
            padding: 20px 0;
        }

        /* Celestial Starry Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--neon-cyan), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, var(--neon-pink), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            opacity: 0.7;
            animation: twinkle 10s infinite linear;
            z-index: 0;
        }

        @keyframes twinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-250px); }
        }

        /* Horizontal Neon Floating "Thank You!" on Celestial Right Side (Video Stage Only) */
        .celestial-video-thankyou {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif;
            font-size: 38px;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 15px var(--neon-pink), 0 0 30px var(--neon-cyan), 0 0 45px #ffffff;
            pointer-events: none;
            z-index: 5;
            writing-mode: horizontal-tb;
            animation: videoThankPulse 2.5s infinite alternate;
            display: none;
        }

        @keyframes videoThankPulse {
            0% { opacity: 0.6; transform: translateY(-50%) scale(0.96); text-shadow: 0 0 10px var(--neon-pink), 0 0 20px #ffffff; }
            100% { opacity: 1; transform: translateY(-50%) scale(1.05); text-shadow: 0 0 20px var(--neon-pink), 0 0 35px var(--neon-cyan), 0 0 50px #ffffff; }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 15px;
        }

        /* Cover Welcome Landing Page Container */
        .cover-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin-bottom: 30px;
        }
        .cover-container.hidden { display: none !important; }

        .cover-view {
            width: 100%;
            height: 560px;
            background: #000 url('cover-image_2.png') center/cover no-repeat;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 42, 133, 0.3), inset 0 0 25px rgba(0, 243, 255, 0.2);
            border: 2px solid var(--neon-pink);
            position: relative;
        }

        .start-btn {
            margin-top: 25px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: #fff;
            border: 2px solid var(--neon-cyan);
            padding: 14px 36px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.6);
            transition: all 0.3s ease;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.8);
        }

        /* Centered Branding & Tagline Under Start Button */
        .cover-brand-box {
            margin-top: 18px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cover-brand {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 30px #ffffff;
            animation: brandPulse 3s infinite alternate;
        }

        .cover-tagline {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
        }

        @keyframes brandPulse {
            0% { opacity: 0.7; text-shadow: 0 0 8px var(--neon-pink), 0 0 15px #ffffff; }
            100% { opacity: 1; text-shadow: 0 0 15px var(--neon-pink), 0 0 25px var(--neon-pink), 0 0 35px #ffffff; }
        }

        /* Stage Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-tabs.hidden { display: none !important; }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: #fff;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.5);
            font-weight: 600;
        }

        /* Canvas Wrapper & Stage Views */
        .stage-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 560px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(176, 0, 255, 0.15);
            border: 2px solid var(--border-glow);
            margin-bottom: 20px;
        }
        .stage-box.hidden { display: none !important; }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* HUD Inch Display Badge */
        .inch-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(7, 7, 18, 0.85);
            border: 1px solid var(--neon-cyan);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 20;
        }
        .inch-hud.target-met {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }
        .inch-hud.out-of-bounds {
            border-color: #ff2a85;
            color: #ff2a85;
            box-shadow: 0 0 12px rgba(255, 42, 133, 0.6);
        }

        /* Control Panel */
        .control-panel {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        .control-panel.hidden { display: none !important; }

        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border: none;
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.4);
        }
        .btn-cyan {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border: none;
        }

        .slider-group {
            margin-bottom: 12px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 5px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--neon-pink);
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-space); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--neon-pink), var(--neon-cyan));
            border-radius: 4px;
        }

        /* Order Submission Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-card {
            background: #111125;
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.3);
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--neon-cyan);
            text-align: center;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.3);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="stars"></div>
    <!-- Floating Celestial Neon Thank You for Video Stage -->
    <div class="celestial-video-thankyou" id="videoThankYou">Thank You!</div>

    <div class="app-container">
        <!-- Navigation Tabs -->
        <div class="nav-tabs hidden" id="navTabs">
            <button class="tab-btn active" onclick="switchStage(1)">1. Example</button>
            <button class="tab-btn" onclick="switchStage(2)">2. Template 1</button>
            <button class="tab-btn" onclick="switchStage(3)">3. Template 2</button>
            <button class="tab-btn" onclick="switchStage(4)">4. Closing</button>
        </div>

        <!-- Cover Welcome Landing Page Container -->
        <div class="cover-container" id="coverContainer">
            <div class="cover-view"></div>
            <button class="start-btn" id="startBtn">✨ Start Designing ✨</button>
            <div class="cover-brand-box">
                <div class="cover-brand">HisNHerFlames.com</div>
                <div class="cover-tagline">Your brand in every flame, your flame in every candle</div>
            </div>
        </div>

        <!-- Main Canvas Viewport -->
        <div class="stage-box hidden" id="stageBox">
            <div id="inchHud" class="inch-hud hidden">
                <span>📏 <span id="hudDims">2.5" × 2.7"</span></span>
            </div>
            <canvas id="customCanvas" width="840" height="1120"></canvas>
            <video id="closingVideo" src="lighter mp4_2.mp4" playsinline muted loop></video>
        </div>

        <!-- Control Panel -->
        <div class="control-panel hidden" id="controlPanel">
            <div class="control-row">
                <label class="btn btn-cyan" style="cursor: pointer;">
                    📁 Upload Image <input type="file" id="imageUpload" accept="image/*" class="hidden">
                </label>
                <button class="btn" onclick="playCoinSound()">🪙 Coin Audio</button>
                <button class="btn" id="lockBtn" onclick="toggleBoxLock()">🔒 Box: Locked</button>
            </div>

            <div class="slider-group">
                <div class="slider-label"><span>Image Width (Inches)</span><span id="imgWVal">2.5"</span></div>
                <input type="range" id="imgWidthSlider" min="50" max="400" value="220" oninput="updateImageWidth(this.value)">
            </div>

            <div class="slider-group">
                <div class="slider-label"><span>Image Height (Inches)</span><span id="imgHVal">2.7"</span></div>
                <input type="range" id="imgHeightSlider" min="50" max="400" value="240" oninput="updateImageHeight(this.value)">
            </div>

            <div class="control-row" style="margin-top: 15px; margin-bottom: 0;">
                <button class="btn btn-primary" onclick="openOrderModal()">🚀 Submit Order</button>
                <button class="btn" id="nextStageBtn" onclick="nextStage()">Next Stage ➡️</button>
            </div>
        </div>
    </div>

    <!-- Order Submission Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-card">
            <div class="modal-title">✨ Submit Your Custom Wrap Order ✨</div>
            <form id="orderForm" onsubmit="submitOrder(event)">
                <!-- Replace with your actual Web3Forms access key -->
                <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY_HERE">
                <input type="hidden" name="subject" value="New Lighter Wrap Custom Order - HisNHerFlames.com">
                
                <input type="text" name="name" class="form-input" placeholder="Your Full Name" required>
                <input type="email" name="email" class="form-input" placeholder="Your Email Address" required>
                <input type="tel" name="phone" class="form-input" placeholder="Phone Number">
                <textarea name="notes" class="form-input" placeholder="Custom engraving or color notes..." rows="3"></textarea>
                
                <div class="control-row" style="margin-top: 15px;">
                    <button type="button" class="btn" onclick="closeOrderModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Send Order</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ASSETS = {
            cover: 'cover-image_2.png',
            example: 'example-image_2.png',
            template1: 'template-1_2.png',
            template2: 'template-2.png',
            closing: 'closing_2.png'
        };

        let currentStage = 0;
        const loadedImages = {};
        let imagesLoadedCount = 0;
        const totalImagesToLoad = Object.keys(ASSETS).length;

        let userImg = null;
        let imgX = 420, imgY = 560, imgW = 220, imgH = 240;
        const targetBox = { x: 420, y: 700, w: 220, h: 240 };
        let isBoxLocked = true;
        let isDraggingImage = false;
        let isDraggingBox = false;
        let startX, startY;
        let isSnapped = false;
        let isOutOfBounds = false;

        let pulseTimer = 0;
        let flameSway = 0;

        const canvas = document.getElementById('customCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('closingVideo');
        const inchHud = document.getElementById('inchHud');
        const coverContainer = document.getElementById('coverContainer');
        const stageBox = document.getElementById('stageBox');
        const controlPanel = document.getElementById('controlPanel');
        const navTabs = document.getElementById('navTabs');
        const videoThankYou = document.getElementById('videoThankYou');

        // Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCoinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            [987.77, 1318.51].forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }, idx * 80);
            });
        }

        function playSnapPop() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playWarningBuzz() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.setValueAtTime(90, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playVictoryChime() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }, idx * 90);
            });
        }

        function initAssets() {
            for (let key in ASSETS) {
                loadedImages[key] = new Image();
                loadedImages[key].src = ASSETS[key];
                loadedImages[key].onload = () => {
                    imagesLoadedCount++;
                    if (imagesLoadedCount === totalImagesToLoad) {
                        requestAnimationFrame(mainLoop);
                    }
                };
                loadedImages[key].onerror = () => {
                    imagesLoadedCount++;
                    if (imagesLoadedCount === totalImagesToLoad) {
                        requestAnimationFrame(mainLoop);
                    }
                };
            }
        }

        function startDesigning() {
            playCoinSound();
            coverContainer.classList.add('hidden');
            stageBox.classList.remove('hidden');
            controlPanel.classList.remove('hidden');
            navTabs.classList.remove('hidden');
            switchStage(1);
        }

        document.getElementById('startBtn').addEventListener('click', startDesigning);

        function mainLoop() {
            pulseTimer += 0.05;
            flameSway = Math.sin(pulseTimer * 1.5) * 8;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentStage === 4) {
                if (loadedImages.closing && loadedImages.closing.complete) {
                    ctx.drawImage(loadedImages.closing, 0, 0, canvas.width, canvas.height);
                }
                renderClosingEffects();
            } else {
                let bgKey = ['cover', 'example', 'template1', 'template2'][currentStage];
                if (loadedImages[bgKey] && loadedImages[bgKey].complete) {
                    ctx.drawImage(loadedImages[bgKey], 0, 0, canvas.width, canvas.height);
                }

                if (currentStage >= 2 && userImg) {
                    ctx.save();
                    let trailGlow = isSnapped ? 20 : (isOutOfBounds ? 15 : 8);
                    ctx.shadowColor = isOutOfBounds ? '#ff2a85' : (isSnapped ? '#00ff66' : '#00f3ff');
                    ctx.shadowBlur = trailGlow;
                    ctx.drawImage(userImg, imgX - imgW / 2, imgY - imgH / 2, imgW, imgH);
                    ctx.restore();
                }

                if (currentStage >= 2) {
                    renderGuideArrows();
                }
            }

            requestAnimationFrame(mainLoop);
        }

        // Render Synced Guide Arrows
        function renderGuideArrows() {
            ctx.save();
            let arrowPulse = 5 + Math.sin(pulseTimer * 4) * 4;
            ctx.strokeStyle = '#00f3ff';
            ctx.fillStyle = '#00f3ff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 10;

            let bx = targetBox.x, by = targetBox.y, bw = targetBox.w, bh = targetBox.h;
            let offset = 18 + arrowPulse;

            // Template 1: Moved 20mm right (+75px) and 15mm down (+60px)
            // Template 2: Moved 10mm up (-40px)
            let offsetX = (currentStage === 2) ? 75 : 0;
            let offsetY = (currentStage === 2) ? 60 : (currentStage === 3 ? -40 : 0);

            let targetX = bx + offsetX;
            let targetY = by + offsetY;

            // Top Arrow pointing Down
            ctx.beginPath();
            ctx.moveTo(targetX, targetY - bh/2 - offset - 10);
            ctx.lineTo(targetX, targetY - bh/2 - offset);
            ctx.moveTo(targetX - 6, targetY - bh/2 - offset - 6);
            ctx.lineTo(targetX, targetY - bh/2 - offset);
            ctx.lineTo(targetX + 6, targetY - bh/2 - offset - 6);
            ctx.stroke();

            // Bottom Arrow pointing Up
            ctx.beginPath();
            ctx.moveTo(targetX, targetY + bh/2 + offset + 10);
            ctx.lineTo(targetX, targetY + bh/2 + offset);
            ctx.moveTo(targetX - 6, targetY + bh/2 + offset + 6);
            ctx.lineTo(targetX, targetY + bh/2 + offset);
            ctx.lineTo(targetX + 6, targetY + bh/2 + offset + 6);
            ctx.stroke();

            ctx.restore();
        }

        // Anchored Flame & Candle Smoke (Canvas Thank You 100% REMOVED)
        function renderClosingEffects() {
            ctx.save();
            let fx = 420;
            let fy = 615;

            // Outer Neon Glow Aura
            let grad = ctx.createRadialGradient(fx, fy - 25, 5, fx, fy - 25, 75);
            grad.addColorStop(0, 'rgba(255, 165, 0, 0.5)');
            grad.addColorStop(0.5, 'rgba(255, 69, 0, 0.15)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(fx, fy - 25, 75, 0, Math.PI * 2);
            ctx.fill();

            // Outer Orange Plume (Swaying ONLY at top)
            ctx.fillStyle = 'rgba(255, 120, 0, 0.85)';
            ctx.beginPath();
            ctx.moveTo(fx - 12, fy);
            ctx.bezierCurveTo(fx - 15, fy - 35, fx + flameSway - 25, fy - 70, fx + flameSway, fy - 95);
            ctx.bezierCurveTo(fx + flameSway + 25, fy - 70, fx + 15, fy - 35, fx + 12, fy);
            ctx.fill();

            // Inner Bright Yellow Core
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.moveTo(fx - 7, fy);
            ctx.bezierCurveTo(fx - 10, fy - 30, fx + flameSway*0.7 - 15, fy - 55, fx + flameSway*0.7, fy - 75);
            ctx.bezierCurveTo(fx + flameSway*0.7 + 15, fy - 55, fx + 10, fy - 30, fx + 7, fy);
            ctx.fill();

            // White-Hot Inner Center
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(fx - 3, fy);
            ctx.bezierCurveTo(fx - 5, fy - 20, fx + flameSway*0.4 - 8, fy - 40, fx + flameSway*0.4, fy - 55);
            ctx.bezierCurveTo(fx + flameSway*0.4 + 8, fy - 40, fx + 5, fy - 20, fx + 3, fy);
            ctx.fill();

            // Candle Smoke Rising
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            for (let i = 0; i < 3; i++) {
                let sx = 280 + i * 120 + Math.sin(pulseTimer + i) * 15;
                let sy = 680 - ((pulseTimer * 40 + i * 50) % 180);
                let sr = 8 + ((pulseTimer * 10 + i * 20) % 25);
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function switchStage(stageIdx) {
            currentStage = stageIdx;
            videoThankYou.style.display = 'none';

            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', (idx + 1) === stageIdx);
            });

            if (currentStage === 4) {
                inchHud.classList.add('hidden');
                canvas.style.display = 'block';
                video.style.display = 'none';
            } else if (currentStage >= 2) {
                inchHud.classList.remove('hidden');
                canvas.style.display = 'block';
                video.style.display = 'none';
            } else {
                inchHud.classList.add('hidden');
                canvas.style.display = 'block';
                video.style.display = 'none';
            }
        }
        window.switchStage = switchStage;

        function nextStage() {
            if (currentStage < 4) {
                switchStage(currentStage + 1);
            } else {
                canvas.style.display = 'none';
                video.style.display = 'block';
                video.play();
                inchHud.classList.add('hidden');
                videoThankYou.style.display = 'block'; // Shows neon Thank You in celestial background during MP4 video
                playVictoryChime();
            }
        }
        window.nextStage = nextStage;

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userImg = new Image();
                    userImg.onload = function() {
                        imgW = 220;
                        imgH = 240;
                        imgX = targetBox.x;
                        imgY = targetBox.y;
                        document.getElementById('imgWidthSlider').value = imgW;
                        document.getElementById('imgHeightSlider').value = imgH;
                        playCoinSound();
                    };
                    userImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function updateImageWidth(val) {
            imgW = parseInt(val);
            let inchesW = (imgW / 88).toFixed(1);
            document.getElementById('imgWVal').innerText = inchesW + '"';
            checkBounds();
        }
        window.updateImageWidth = updateImageWidth;

        function updateImageHeight(val) {
            imgH = parseInt(val);
            let inchesH = (imgH / 88).toFixed(1);
            document.getElementById('imgHVal').innerText = inchesH + '"';
            checkBounds();
        }
        window.updateImageHeight = updateImageHeight;

        function checkBounds() {
            let iw = (imgW / 88).toFixed(1);
            let ih = (imgH / 88).toFixed(1);
            document.getElementById('hudDims').innerText = iw + '" × ' + ih + '"';

            let dist = Math.hypot(imgX - targetBox.x, imgY - targetBox.y);
            if (dist < 40) {
                if (!isSnapped) {
                    playSnapPop();
                    isSnapped = true;
                }
                isOutOfBounds = false;
                inchHud.className = 'inch-hud target-met';
            } else if (imgX < 100 || imgX > 740 || imgY < 100 || imgY > 1020) {
                if (!isOutOfBounds) {
                    playWarningBuzz();
                    isOutOfBounds = true;
                }
                isSnapped = false;
                inchHud.className = 'inch-hud out-of-bounds';
            } else {
                isSnapped = false;
                isOutOfBounds = false;
                inchHud.className = 'inch-hud';
            }
        }

        function toggleBoxLock() {
            isBoxLocked = !isBoxLocked;
            const btn = document.getElementById('lockBtn');
            btn.innerText = isBoxLocked ? '🔒 Box: Locked' : '🔓 Box: Unlocked';
            playCoinSound();
        }
        window.toggleBoxLock = toggleBoxLock;

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (!isBoxLocked && Math.abs(mouseX - targetBox.x) < targetBox.w/2 && Math.abs(mouseY - targetBox.y) < targetBox.h/2) {
                isDraggingBox = true;
            } else {
                isDraggingImage = true;
            }
            startX = mouseX;
            startY = mouseY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingImage && !isDraggingBox) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
            const dx = mouseX - startX;
            const dy = mouseY - startY;

            if (isDraggingBox) {
                targetBox.x += dx;
                targetBox.y += dy;
            } else if (isDraggingImage) {
                imgX += dx;
                imgY += dy;
                checkBounds();
            }
            startX = mouseX;
            startY = mouseY;
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingImage && Math.hypot(imgX - targetBox.x, imgY - targetBox.y) < 30) {
                imgX = targetBox.x;
                imgY = targetBox.y;
                playSnapPop();
                isSnapped = true;
            }
            isDraggingImage = false;
            isDraggingBox = false;
        });

        function openOrderModal() { document.getElementById('orderModal').style.display = 'flex'; }
        window.openOrderModal = openOrderModal;
        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }
        window.closeOrderModal = closeOrderModal;

        function submitOrder(event) {
            event.preventDefault();
            const form = document.getElementById('orderForm');
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: json
            })
            .then(async (response) => {
                let jsonRes = await response.json();
                if (response.status === 200) {
                    playVictoryChime();
                    alert("🎉 Success! Your custom lighter wrap order has been submitted successfully to HisNHerFlames.com!");
                    closeOrderModal();
                } else {
                    alert(jsonRes.message || "Something went wrong. Please check your Web3Forms access key.");
                }
            })
            .catch(error => {
                console.error(error);
                alert("Submission failed. Please check your internet connection.");
            });
        }
        window.submitOrder = submitOrder;

        window.onload = initAssets;
    </script>
</body>
</html>
