<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HisNHerFlames.com - Custom Lighter Wrap Studio</title>
    <style>
        :root {
            --neon-pink: #ff2a85;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --bg-space: #070712;
            --panel-bg: rgba(15, 15, 30, 0.85);
            --border-glow: rgba(0, 243, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-space);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            position: relative;
            padding: 20px 0;
        }

        /* Celestial Starry Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--neon-cyan), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, var(--neon-pink), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.6;
            animation: twinkle 8s infinite linear;
            z-index: 0;
        }

        @keyframes twinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 15px;
        }

        /* Stage Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: #fff;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.5);
            font-weight: 600;
        }

        /* Canvas Wrapper & Stage Views */
        .stage-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 560px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(176, 0, 255, 0.15);
            border: 2px solid var(--border-glow);
            margin-bottom: 20px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* HUD Inch Display Badge */
        .inch-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(7, 7, 18, 0.85);
            border: 1px solid var(--neon-cyan);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 20;
        }
        .inch-hud.target-met {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        /* Control Panel */
        .control-panel {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border: none;
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.4);
        }

        .btn-cyan {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border: none;
        }

        /* Sliders */
        .slider-group {
            margin-bottom: 12px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--neon-pink);
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-space);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--neon-pink), var(--neon-cyan));
            border-radius: 4px;
        }

        /* Modal Overlay for Order Form */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: #111125;
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.3);
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--neon-cyan);
            text-align: center;
        }

        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.3);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="app-container">
        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchStage(0)">1. Cover</button>
            <button class="tab-btn" onclick="switchStage(1)">2. Example</button>
            <button class="tab-btn" onclick="switchStage(2)">3. Template 1</button>
            <button class="tab-btn" onclick="switchStage(3)">4. Template 2</button>
            <button class="tab-btn" onclick="switchStage(4)">5. Closing</button>
        </div>

        {/* Main Canvas Viewport */}
        <div class="stage-box" id="stageBox">
            <div id="inchHud" class="inch-hud hidden">
                <span>📏 <span id="hudDims">2.5" × 2.7"</span></span>
            </div>
            <canvas id="customCanvas" width="840" height="1120"></canvas>
            <video id="closingVideo" src="lighter mp4_2.mp4" playsinline muted loop></video>
        </div>

        {/* Control Panel */}
        <div class="control-panel">
            <div class="control-row">
                <label class="btn btn-cyan" style="cursor: pointer;">
                    📁 Upload Image <input type="file" id="imageUpload" accept="image/*" class="hidden">
                </label>
                <button class="btn" onclick="triggerPopSound()">🔊 Audio Pop</button>
                <button class="btn" id="lockBtn" onclick="toggleBoxLock()">🔓 Box: Unlocked</button>
            </div>

            <div class="slider-group">
                <div class="slider-label"><span>Image Scale / Zoom</span><span id="scaleVal">100%</span></div>
                <input type="range" id="imgScaleSlider" min="10" max="300" value="100" oninput="updateImageScale(this.value)">
            </div>

            <div class="slider-group">
                <div class="slider-label"><span>Box Width (Inches)</span><span id="boxWVal">2.5"</span></div>
                <input type="range" id="boxWidthSlider" min="50" max="350" value="220" oninput="updateBoxWidth(this.value)">
            </div>

            <div class="slider-group">
                <div class="slider-label"><span>Box Height (Inches)</span><span id="boxHVal">2.7"</span></div>
                <input type="range" id="boxHeightSlider" min="50" max="350" value="240" oninput="updateBoxHeight(this.value)">
            </div>

            <div class="control-row" style="margin-top: 15px; margin-bottom: 0;">
                <button class="btn btn-primary" onclick="openOrderModal()">🚀 Submit Order</button>
                <button class="btn" id="nextStageBtn" onclick="nextStage()">Next Stage ➡️</button>
            </div>
        </div>
    </div>

    {/* Order Submission Modal */}
    <div class="modal-overlay" id="orderModal">
        <div class="modal-card">
            <div class="modal-title">✨ Submit Your Custom Wrap Order ✨</div>
            <form id="orderForm" onsubmit="submitOrder(event)">
                <!-- Replace with your actual Web3Forms access key -->
                <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY_HERE">
                <input type="hidden" name="subject" value="New Lighter Wrap Custom Order - HisNHerFlames.com">
                
                <input type="text" name="name" class="form-input" placeholder="Your Full Name" required>
                <input type="email" name="email" class="form-input" placeholder="Your Email Address" required>
                <input type="tel" name="phone" class="form-input" placeholder="Phone Number">
                <textarea name="notes" class="form-input" placeholder="Custom engraving or color notes..." rows="3"></textarea>
                
                <div class="control-row" style="margin-top: 15px;">
                    <button type="button" class="btn" onclick="closeOrderModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Send Order</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- ASSET CONFIGURATION (.png mappings) ---
        const ASSETS = {
            cover: 'cover-image_2.png',
            example: 'example-image_2.png',
            template1: 'template-1_2.png',
            template2: 'template-2.png',
            closing: 'closing_2.png'
        };

        let currentStage = 0; // 0:Cover, 1:Example, 2:T1, 3:T2, 4:Closing
        const loadedImages = {};
        let imagesLoadedCount = 0;
        const totalImagesToLoad = Object.keys(ASSETS).length;

        // Interactive Object State (for Templates 1 & 2)
        let userImg = null;
        let imgX = 250, imgY = 350, imgScale = 1;
        let boxX = 250, boxY = 600, boxW = 220, boxH = 240;
        let isBoxLocked = false;
        let isDraggingImage = false;
        let isDraggingBox = false;
        let startX, startY;

        // Animation & Pulse Phase
        let pulseTimer = 0;
        let flameSway = 0;

        const canvas = document.getElementById('customCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('closingVideo');
        const inchHud = document.getElementById('inchHud');

        // Web Audio API for Pop Snap & Victory Chime
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function triggerPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playVictoryChime() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }, idx * 90);
            });
        }

        // Load Images
        function initAssets() {
            for (let key in ASSETS) {
                loadedImages[key] = new Image();
                loadedImages[key].src = ASSETS[key];
                loadedImages[key].onload = () => {
                    imagesLoadedCount++;
                    if (imagesLoadedCount === totalImagesToLoad) {
                        requestAnimationFrame(mainLoop);
                    }
                };
                loadedImages[key].onerror = () => {
                    console.warn("Asset load warning for: " + ASSETS[key]);
                    imagesLoadedCount++;
                    if (imagesLoadedCount === totalImagesToLoad) {
                        requestAnimationFrame(mainLoop);
                    }
                };
            }
        }

        // Main Animation & Render Loop
        function mainLoop() {
            pulseTimer += 0.05;
            flameSway = Math.sin(pulseTimer * 1.5) * 8;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentStage === 4) {
                // Closing Stage background image
                if (loadedImages.closing && loadedImages.closing.complete) {
                    ctx.drawImage(loadedImages.closing, 0, 0, canvas.width, canvas.height);
                }
                renderClosingEffects();
            } else {
                // Render corresponding asset background
                let bgKey = ['cover', 'example', 'template1', 'template2'][currentStage];
                if (loadedImages[bgKey] && loadedImages[bgKey].complete) {
                    ctx.drawImage(loadedImages[bgKey], 0, 0, canvas.width, canvas.height);
                }

                // Render User Image & Boundary Box on Templates 1 & 2
                if (currentStage >= 2) {
                    if (userImg) {
                        ctx.save();
                        ctx.translate(imgX, imgY);
                        ctx.scale(imgScale, imgScale);
                        ctx.drawImage(userImg, -userImg.width / 2, -userImg.height / 2);
                        ctx.restore();
                    }

                    // Draw Boundary Box with Neon Glow & Inch Target Check
                    ctx.save();
                    let glowIntensity = 10 + Math.sin(pulseTimer * 2) * 6;
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = glowIntensity;
                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([8, 6]);
                    ctx.strokeRect(boxX - boxW / 2, boxY - boxH / 2, boxW, boxH);
                    ctx.restore();

                    // Heartbeat Neon Glow highlight on original "HERE" text area
                    ctx.save();
                    let herePulse = 15 + Math.sin(pulseTimer * 3) * 8;
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = herePulse;
                    ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(320, 420, 180, 80);
                    ctx.restore();
                }
            }

            requestAnimationFrame(mainLoop);
        }

        // Render 3D Swaying Flame & Double-Lit Candle Smoke on Closing Stage
        function renderClosingEffects() {
            ctx.save();
            // Lighter Flame at top tip (~X: 420, Y: 580)
            let fx = 420 + flameSway;
            let fy = 560;

            // Outer Glow Aura
            let grad = ctx.createRadialGradient(fx, fy - 30, 5, fx, fy - 30, 70);
            grad.addColorStop(0, 'rgba(255, 165, 0, 0.6)');
            grad.addColorStop(0.5, 'rgba(255, 69, 0, 0.2)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(fx, fy - 30, 70, 0, Math.PI * 2);
            ctx.fill();

            // Flame Core (3D Swaying Shape)
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.moveTo(fx, fy - 80);
            ctx.bezierCurveTo(fx + 25 + flameSway*0.5, fy - 40, fx + 15, fy - 10, fx, fy);
            ctx.bezierCurveTo(fx - 15, fy - 10, fx - 25 - flameSway*0.5, fy - 40, fx, fy - 80);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(fx, fy - 60);
            ctx.bezierCurveTo(fx + 8, fy - 35, fx + 5, fy - 20, fx, fy - 10);
            ctx.bezierCurveTo(fx - 5, fy - 20, fx - 8, fy - 35, fx, fy - 60);
            ctx.fill();

            // Candle Smoke (Rising from side wicks)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            for (let i = 0; i < 3; i++) {
                let sx = 280 + i * 120 + Math.sin(pulseTimer + i) * 15;
                let sy = 680 - ((pulseTimer * 40 + i * 50) % 180);
                let sr = 8 + ((pulseTimer * 10 + i * 20) % 25);
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Stage Navigation
        function switchStage(stageIdx) {
            currentStage = stageIdx;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === stageIdx);
            });

            if (currentStage === 4) {
                inchHud.classList.add('hidden');
                canvas.style.display = 'block';
                video.style.display = 'none';
            } else if (currentStage >= 2) {
                inchHud.classList.remove('hidden');
                canvas.style.display = 'block';
                video.style.display = 'none';
            } else {
                inchHud.classList.add('hidden');
                canvas.style.display = 'block';
                video.style.display = 'none';
            }
        }

        function nextStage() {
            if (currentStage < 4) {
                switchStage(currentStage + 1);
            } else {
                // Transition to Final 3D MP4 Video Showcase
                canvas.style.display = 'none';
                video.style.display = 'block';
                video.play();
                inchHud.classList.add('hidden');
                playVictoryChime();
            }
        }

        // Image Upload Handling
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userImg = new Image();
                    userImg.onload = function() {
                        imgScale = 1;
                        document.getElementById('imgScaleSlider').value = 100;
                        document.getElementById('scaleVal').innerText = '100%';
                        triggerPopSound();
                    };
                    userImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Controls & Resizing
        function updateImageScale(val) {
            imgScale = val / 100;
            document.getElementById('scaleVal').innerText = val + '%';
        }

        function updateBoxWidth(val) {
            boxW = parseInt(val);
            let inchesW = (boxW / 88).toFixed(1);
            document.getElementById('boxWVal').innerText = inchesW + '"';
            checkInchTarget();
        }

        function updateBoxHeight(val) {
            boxH = parseInt(val);
            let inchesH = (boxH / 88).toFixed(1);
            document.getElementById('boxHVal').innerText = inchesH + '"';
            checkInchTarget();
        }

        function checkInchTarget() {
            let iw = (boxW / 88).toFixed(1);
            let ih = (boxH / 88).toFixed(1);
            document.getElementById('hudDims').innerText = iw + '" × ' + ih + '"';
            if (Math.abs(iw - 2.5) <= 0.2 && Math.abs(ih - 2.7) <= 0.2) {
                inchHud.classList.add('target-met');
            } else {
                inchHud.classList.remove('target-met');
            }
        }

        function toggleBoxLock() {
            isBoxLocked = !isBoxLocked;
            const btn = document.getElementById('lockBtn');
            btn.innerText = isBoxLocked ? '🔒 Box: Locked' : '🔓 Box: Unlocked';
            triggerPopSound();
        }

        // Canvas Mouse Dragging Interaction
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (!isBoxLocked && Math.abs(mouseX - boxX) < boxW / 2 && Math.abs(mouseY - boxY) < boxH / 2) {
                isDraggingBox = true;
            } else {
                isDraggingImage = true;
            }
            startX = mouseX;
            startY = mouseY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingImage && !isDraggingBox) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
            const dx = mouseX - startX;
            const dy = mouseY - startY;

            if (isDraggingBox) {
                boxX += dx;
                boxY += dy;
            } else if (isDraggingImage) {
                imgX += dx;
                imgY += dy;
            }
            startX = mouseX;
            startY = mouseY;
        });

        window.addEventListener('mouseup', () => {
            isDraggingImage = false;
            isDraggingBox = false;
        });

        // Order Modal Functions
        function openOrderModal() {
            document.getElementById('orderModal').style.display = 'flex';
        }
        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        // Web3Forms Submission
        function submitOrder(event) {
            event.preventDefault();
            const form = document.getElementById('orderForm');
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let jsonRes = await response.json();
                if (response.status === 200) {
                    playVictoryChime();
                    alert("🎉 Success! Your custom lighter wrap order has been submitted successfully to HisNHerFlames.com!");
                    closeOrderModal();
                } else {
                    alert(jsonRes.message || "Something went wrong. Please check your Web3Forms access key.");
                }
            })
            .catch(error => {
                console.error(error);
                alert("Submission failed. Please check your internet connection.");
            });
        }

        // Initialize App on Load
        window.onload = initAssets;
    </script>
</body>
</html>
